<div class="empty-state-container" role="status">
  <div class="icon-circle" aria-hidden="true">
    <span class="material-symbols-outlined empty-icon">{{ icon }}</span>
  </div>
  <h3 class="empty-title">{{ title }}</h3>
  <p class="empty-description">{{ description }}</p>

  <div *ngIf="actionLabel" class="empty-actions">
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="onActionClick()">
      {{ actionLabel }}
    </button>
  </div>
</div>
